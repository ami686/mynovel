<script>
document.addEventListener('DOMContentLoaded', function () {
  var isTouch = window.matchMedia('(hover: none)').matches;

  if (!isTouch) return;

  // ===== 触摸屏：点击展开逻辑 =====
  document.querySelectorAll('.menu-item.has-dropdown > a').forEach(function (link) {
    link.addEventListener('click', function (e) {
      var parentLi = link.parentElement;
      if (!parentLi.classList.contains('open')) {
        e.preventDefault();
        document.querySelectorAll('.menu-item.has-dropdown.open').forEach(function (li) {
          li.classList.remove('open');
        });
        parentLi.classList.add('open');
      }
    });
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.menu-item.has-dropdown')) {
      document.querySelectorAll('.menu-item.has-dropdown.open').forEach(function (li) {
        li.classList.remove('open');
      });
    }
  });
});
</script>

  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

<script>
(function() {
    // 主逻辑函数
    function initSmartSelector() {
        if (window.smartSelectorInitialized) return;
        window.smartSelectorInitialized = true;

        const allLanguages = [
            { code: 'en', name: 'English (英语)' },
            { code: 'zh-TW', name: 'Traditional Chinese (繁體中文)' },
            { code: 'ja', name: 'Japanese (日本語)' },
            { code: 'ko', name: 'Korean (한국어)' },
            { code: 'fr', name: 'French (Français)' },
            { code: 'de', name: 'German (Deutsch)' },
            { code: 'es', name: 'Spanish (Español)' },
            { code: 'ru', name: 'Russian (Pусский)' },
            { code: 'pt', name: 'Portuguese (Português)' },
            { code: 'it', name: 'Italian (Italiano)' },
            { code: 'vi', name: 'Vietnamese (Tiếng Việt)' },
            { code: 'th', name: 'Thai (ไทย)' },
            { code: 'id', name: 'Indonesian (Bahasa Indonesia)' },
            { code: 'ar', name: 'Arabic (العربية)' },
            { code: 'hi', name: 'Hindi (हिन्दी)' },
            { code: 'ms', name: 'Malay (Bahasa Melayu)' }
        ];

        // 1. 获取语言
        const userLang = navigator.language || navigator.userLanguage || '';
        const isSimplifiedUser = userLang.toLowerCase() === 'zh-cn' || userLang.toLowerCase() === 'zh';

        // 2. 显示主容器
        const container = document.getElementById('smart-translate-dropdown-container');
        if (container) container.style.display = 'block';

        const selectBox = document.getElementById('smart-lang-selector');
        let matchedLang = null; // 用于存储匹配到的母语对象

        if (selectBox) {
            selectBox.innerHTML = '';

            // 添加默认项
            const promptOption = document.createElement('option');
            promptOption.value = '';
            promptOption.textContent = '🌐 Translate this page...';
            promptOption.selected = true;
            selectBox.appendChild(promptOption);

            // 循环添加选项并寻找匹配
            allLanguages.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang.code;
                option.textContent = lang.name;

                if (!isSimplifiedUser) {
                     if (lang.code.toLowerCase() === userLang.toLowerCase() ||
                         lang.code.split('-')[0].toLowerCase() === userLang.split('-')[0].toLowerCase()) {

                        option.textContent = `✅ ${lang.name}`;
                        matchedLang = lang; // 记录匹配到的语言
                     }
                }
                selectBox.appendChild(option);
            });
        }

        // 3. 【核心新增】如果匹配到了母语，显示上方弹窗
        if (matchedLang) {
            const popup = document.getElementById('smart-native-popup');
            const btn = document.getElementById('smart-btn-action');

            if (popup && btn) {
                // 设置按钮文字和点击事件
                btn.innerHTML = `<span style="margin-right:8px;">Google Translate to:</span>
                                 <span style="font-size:1.1em; text-decoration:underline;">${matchedLang.name}</span>`;

                btn.onclick = function() {
                    doTranslate(matchedLang.code);
                };

                // 显示弹窗
                popup.style.display = 'block';
            }
        }
    }

    // 启动逻辑
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(initSmartSelector, 1);
    } else {
        document.addEventListener('DOMContentLoaded', initSmartSelector);
    }
})();

// --- 全局功能函数 ---

// 执行翻译跳转
function doTranslate(targetLang) {
    if (targetLang) {
        const currentUrl = encodeURIComponent(window.location.href);
        const translateUrl = 'https://translate.google.com/translate?sl=auto&tl=' + targetLang + '&u=' + currentUrl;
        window.open(translateUrl, '_blank');
    }
}

// 下拉菜单触发
function triggerSelectorTranslate(selectElement) {
    const targetLang = selectElement.value;
    doTranslate(targetLang);
    if(targetLang) selectElement.selectedIndex = 0;
}

// 关闭弹窗
function closeSmartPopup() {
    const popup = document.getElementById('smart-native-popup');
    if (popup) popup.style.display = 'none';
}
</script>
