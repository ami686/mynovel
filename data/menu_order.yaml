# 菜单顺序与分栏配置
# 只需要改这一个文件，不用再逐个打开分类的 _index.md
#
# 用法一：控制"二级菜单"的顺序和分栏（比如"短篇"下面的 童话/寓言/历史故事……）
#   最外层的 key 是"父级菜单名"（跟菜单里显示的名字一致，比如"短篇"）
#   下面按你想要的顺序列出子分类的 title，col 填 1 或 2 表示进第几栏
#   没有列在这里的分类，会自动排到当前项目数较少的那一栏，排在列出的分类后面
#
# 用法二：控制"三级菜单"的顺序（比如"童话"下面的 格林童话/安徒生童话……）
#   key 改成对应"二级分类"自己的名字（比如"童话"），不需要写 col
#   同样，列出的按顺序排前面，没列出的保持原来顺序接在后面
#
# 这两种用法可以同时写在同一个文件里，互不影响

短篇:
  - title: 童话
    col: 1
  - title: 寓言
    col: 2

童话:
  - title: 格林童话大合集
  - title: 安徒生童话
  - title: 其它经典童话
  - title: 一千零一夜
  - title: 原创童话

寓言:
  - title: 伊索寓言大合集
  - title: 新编寓言

